<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">

    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">

    <title>蠢蛋換算</title>
  </head>
  <body>
    
    
    <nav class="navbar navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="../../index.html">蠢蛋換算</a>
            <form class="d-flex">
            <button class="btn btn-outline-primary me-2" type="button" onclick="location.href='../selection.html'">開始換算</button>
                
            </form>
        </div>
    </nav>
    
    <section class="convert">
        <h1>長度單位換算</h1>
        <br><br>
        <table width="100%">
            <tr>
                <th></th>
                <th>數值輸入</th>
                <th></th>
                <th>轉換前單位</th>
                <th>轉換後單位</th>
                <th></th>
            </tr>
            <tr>
                <td rowspan="3" width="10%">

                </td>
                <td width="40%">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="number" placeholder="FloatingNumber">
                        <label for="FloatingNumber">請輸入數字</label>
                    </div>

                </td>
                <td rowspan="3" width="10%">

                </td>
                <td rowspan="3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault1" id="mm1" checked>
                        <label class="form-check-label" for="flexRadioDefault1">
                          mm
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault1" id="cm1" >
                        <label class="form-check-label" for="flexRadioDefault2">
                          cm
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault1" id="km1" >
                        <label class="form-check-label" for="flexRadioDefault3">
                          km
                        </label>
                      </div>
                </td>
                <td rowspan="3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault2" id="mm2" checked>
                        <label class="form-check-label" for="flexRadioDefault1">
                          mm
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault2" id="cm2" >
                        <label class="form-check-label" for="flexRadioDefault2">
                          cm
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault2" id="km2" >
                        <label class="form-check-label" for="flexRadioDefault3">
                          km
                        </label>
                      </div>

                </td>
                <td rowspan="3" width="10%">

                </td>
            </tr>
            <tr height="10px">

            </tr>
            <tr>
                <td width="40%">
                    <input class="form-control" type="text" placeholder="Readonly input here..." aria-label="答案在此顯示" id="result" readonly>
                </td>
            </tr>
        </table>

        <div class="count">
            <button type="button" class="btn btn-outline-secondary btn-lg" id="reset">重設</button>
            　
            <button type="button" class="btn btn-outline-primary btn-lg" id="calculate">計算</button>
        </div>

    </section>

    <footer>
        <div class="footer-content" >
            <img src="../../img/icon.png" width="80" height="80">
            <h1><yellow>蠢蛋</yellow>換算</h1>

        </div>
        <div class="footer-bottom">
            <p>&copy;2024　蠢蛋換算</p>

        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
    <script src="length.js"></script>
    
  </body>
</html>
